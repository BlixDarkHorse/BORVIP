<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BDH · Modo Sinergia IA</title><style>
:root{--b:#080912;--p:#111426;--l:#303657;--g:#ffd66b;--m:#ff55b8;--c:#62e8ff;--t:#f5f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#252044,#080912 55%);color:var(--t);font:15px system-ui;min-height:100vh}.app{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.nav{position:sticky;top:0;z-index:4;display:flex;justify-content:center;gap:9px;padding:10px;background:#090b16ee;border-bottom:1px solid var(--l)}button,input{font:inherit}.icon{width:56px;height:56px;border:1px solid #3a4169;border-radius:17px;background:#171c34;color:#fff;font-size:26px;position:relative}.icon:hover{border-color:var(--g)}.icon:hover:after{content:attr(data-tip);position:absolute;top:65px;left:50%;transform:translateX(-50%);width:max-content;max-width:240px;padding:8px;border:1px solid var(--g);border-radius:8px;background:var(--p);font-size:12px;z-index:9}.search{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:8px;background:var(--p);border:1px solid var(--l);border-radius:10px}.search.open{display:block}.search input{width:260px;padding:9px;border:1px solid var(--l);border-radius:7px;background:var(--b);color:#fff}.work{display:grid;grid-template-columns:64px minmax(0,1fr) 0;gap:10px;width:min(1100px,100%);margin:auto;padding:12px}.tube{height:max-content;padding:10px 7px;border:1px solid var(--l);border-radius:32px;background:var(--p);display:grid;gap:10px}.tube button{width:48px;height:48px;border:0;border-radius:50%;background:#222947;color:#fff;font-size:21px}.tube button:hover{color:var(--g)}.chat{min-height:calc(100vh - 132px);display:flex;flex-direction:column;border:1px solid var(--l);border-radius:18px;background:#0d1020d9;overflow:hidden}.head{padding:14px 16px;border-bottom:1px solid var(--l);background:#151a30}.status{color:var(--c);font-size:12px}.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:88%;padding:10px 13px;border-radius:15px;background:#202744}.bot{border-left:3px solid var(--m)}.user{align-self:flex-end;background:#3c2853;border-right:3px solid var(--g)}.quick{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 10px}.quick button,.send{padding:8px 11px;border:1px solid #4a5580;border-radius:10px;background:#1c2442;color:#fff}.composer{display:flex;gap:8px;padding:11px;border-top:1px solid var(--l)}.composer input{min-width:0;flex:1;padding:11px;border:1px solid var(--l);border-radius:10px;background:var(--b);color:#fff}.send{background:linear-gradient(135deg,#8b3177,#3c4c91);padding-inline:18px}.right{display:none}.right.open{display:block;position:fixed;right:8px;top:78px;width:min(300px,calc(100% - 16px));z-index:8;padding:15px;border:1px solid var(--l);border-radius:18px;background:var(--p)}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,var(--m),var(--c));font-size:28px}.profile{text-align:center}.profile button{width:100%;margin-top:10px;padding:9px;border:1px solid var(--l);border-radius:8px;background:#202746;color:#fff}.line{height:7px;border-top:2px solid var(--g);margin:0 12px 6px}.full .tube,.full .right,.full .quick,.full .head{display:none}.full .work{display:block;padding:0}.full .chat{border:0;border-radius:0;min-height:calc(100vh - 77px)}@media(max-width:650px){.nav{gap:5px}.icon{width:49px;height:49px;border-radius:14px;font-size:22px}.work{grid-template-columns:54px minmax(0,1fr);padding:7px 5px;gap:6px}.tube{width:54px;padding:8px 4px}.tube button{width:42px;height:42px}.chat{min-height:calc(100vh - 125px)}}
</style></head><body><div class="app" id="app"><nav class="nav"><button class="icon" data-tip="Inicio">⌂</button><button class="icon" data-tip="Originales: producciones de BDH Entertainment">✦</button><button class="icon" data-tip="Anime y universos">◈</button><button class="icon" data-tip="Stars: acceso y comunidad">★</button><button class="icon" id="searchBtn" data-tip="Buscar contenido">⌕</button><button class="icon" id="profileBtn" data-tip="Perfil y configuración">◉</button><div class="search" id="search"><input placeholder="Buscar contenido..."></div></nav><main class="work"><aside class="tube"><button data-tip="Blazar" id="blazar">✦</button><button data-tip="Configuración" id="settings">⚙</button><button data-tip="Buscar" id="tubeSearch">⌕</button></aside><section class="chat"><div class="head"><b>Violeta · Modo Sinergia IA</b><div class="status">● conexión minimalista BDH</div></div><div class="msgs" id="msgs"></div><div class="quick" id="quick"></div><form class="composer" id="form"><input id="input" placeholder="Nombre de usuario..." autocomplete="off"><button class="send">➤</button></form></section><aside class="right" id="right"><div class="profile"><div class="avatar" id="avatar">?</div><div id="profileName">Visitante</div><hr><small>Modo activo: Sinergia IA</small><button id="legacy">Cambiar a Modo de Culto (Legacy)</button><button id="logout">Cerrar sesión</button></div></aside></main><footer class="line"></footer></div><script>
const $=s=>document.querySelector(s),M=$('#msgs'),I=$('#input'),Q=$('#quick'),A=$('#app');let stage='user',p={};function say(t,w='bot'){let d=document.createElement('div');d.className='bubble '+w;d.textContent=t;M.append(d);M.scrollTop=M.scrollHeight}function opts(a,f){Q.innerHTML='';a.forEach(x=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>f(x);Q.append(b)})}function begin(){say('Hola, soy Violeta. Para entrar sin fricción, escribe tu nombre de usuario.');opts(['Crear cuenta','Ya tengo cuenta'],x=>say(x,'user'))}function finish(){localStorage.setItem('bdh-sinergia-user',JSON.stringify(p));$('#profileName').textContent=p.user;$('#avatar').textContent=p.user[0]?.toUpperCase()||'V';A.classList.add('full');stage='chat';say('Bienvenido, '+p.user+'. Te recomiendo explorar Originales BDH, Anime y Stars. También puedo explicarte de qué trata cada título y por qué verlo. ¿Qué quieres descubrir?');I.placeholder='Pregunta a Violeta...'}function next(v){say(v,'user');if(stage==='user'){p.user=v;stage='pin';I.placeholder='Tu clave o NIP';say('Perfecto. Ahora escribe tu clave o NIP.')}else if(stage==='pin'){p.pin=v;stage='anime';say('¿Qué anime te gusta? Puedes elegir varios.');opts(['Acción','Fantasía','Romance','Ciencia ficción','No veo anime'],pick)}else if(stage==='anime'){p.anime=(p.anime||[]).concat(v);if(v==='No veo anime'||p.anime.length>1){stage='series';say('¿Qué géneros de series o películas prefieres?');opts(['Drama','Comedia','Thriller','Ciencia ficción','Animación','Listo'],pick)}}else if(stage==='series'){if(v==='Listo'){stage='titles';Q.innerHTML='';say('Escribe un título que quieras ver o pon “sorpréndeme”.');I.placeholder='Título o preferencia'}else{p.series=(p.series||[]).concat(v)}}else if(stage==='titles'){p.titles=v;finish()}}function pick(x){say(x,'user');if(stage==='anime')pickAnime(x);else if(stage==='series')pickSeries(x)}function pickAnime(x){p.anime=(p.anime||[]).concat(x);if(x==='No veo anime'||p.anime.length>1){stage='series';say('¿Qué géneros de series o películas prefieres?');opts(['Drama','Comedia','Thriller','Ciencia ficción','Animación','Listo'],pickSeries)}}function pickSeries(x){if(x!=='Listo'){p.series=(p.series||[]).concat(x)}else{stage='titles';Q.innerHTML='';say('Escribe un título que quieras ver o pon “sorpréndeme”.');I.placeholder='Título o preferencia'}}$('#form').onsubmit=e=>{e.preventDefault();let v=I.value.trim();if(!v)return;I.value='';stage==='chat'?(say(v,'user'),setTimeout(()=>say('Estoy preparando una recomendación para “'+v+'”.'),220)):next(v)};$('#searchBtn').onclick=()=>$('#search').classList.toggle('open');$('#tubeSearch').onclick=()=>{$('#search').classList.add('open');$('#search input').focus()};$('#settings').onclick=()=>$('#right').classList.toggle('open');$('#profileBtn').onclick=()=>$('#right').classList.toggle('open');$('#blazar').onclick=()=>say('Blazar está activo: aquí empieza tu recorrido BDH.');$('#legacy').onclick=()=>location.href='index.html';$('#logout').onclick=()=>{localStorage.removeItem('bdh-sinergia-user');location.reload()};let s=JSON.parse(localStorage.getItem('bdh-sinergia-user')||'null');if(s){p=s;$('#profileName').textContent=s.user;$('#avatar').textContent=s.user[0]?.toUpperCase()||'V';A.classList.add('full');stage='chat';say('Qué gusto verte, '+s.user+'. ¿Qué quieres ver hoy?')}else begin();
</script></body></html>
