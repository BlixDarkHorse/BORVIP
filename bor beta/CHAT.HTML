    <!-- ========================================================================= -->
    <!-- 3. MÓDULO CHAT: GALAXY VYOLETA (AISLADO, COPIAR DESDE AQUÍ HACIA ABAJO)  -->
    <!-- ========================================================================= -->
    
    <style id="galaxy-chat-styles">
        /* Variables internas del chat para no depender del exterior */
        :root {
            --gx-pink: #ff00ff;
            --gx-pink-glow: rgba(255, 0, 255, 0.4);
            --gx-gold: #b8860b;
            --gx-gold-glow: rgba(184, 134, 11, 0.4);
            --gx-dark: rgba(10, 5, 10, 0.9);
            --gx-acrylic: radial-gradient(circle at top left, rgba(255,0,255,0.15) 0%, rgba(0,0,0,0.6) 60%, rgba(184,134,11,0.1) 100%);
        }

        #gx-chat-container {
            position: fixed;
            bottom: 40px;
            left: 40px; 
            z-index: 9999;
            pointer-events: none; /* Deja pasar clicks al fondo */
        }

        /* Ventana Abierta - EVOLUCIONADA A GLOBO FRAMELESS */
        .gx-chat-window {
            width: 360px;
            height: 520px;
            background: var(--gx-acrylic);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            /* Forma de globo asimétrico (esquina inferior izquierda puntiaguda apuntando al avatar) */
            border-radius: 30px 30px 30px 5px; 
            border: 1px solid rgba(255, 0, 255, 0.3);
            border-top: 1px solid rgba(184, 134, 11, 0.5); /* Destello dorado arriba */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(255,0,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            pointer-events: auto;
            transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom left;
        }

        .gx-chat-window.gx-hidden {
            opacity: 0;
            transform: scale(0.1) translate(-50px, 50px);
            pointer-events: none;
            position: absolute;
        }

        .gx-header {
            /* Header integrado sin bordes duros */
            background: transparent;
            padding: 20px 20px 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: grab;
            user-select: none;
        }
        .gx-header:active { cursor: grabbing; }

        .gx-title {
            font-size: 1.1em;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px var(--gx-pink), 0 0 20px var(--gx-gold);
            letter-spacing: 1px;
        }

        .gx-avatar {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gx-gold);
            box-shadow: 0 0 15px var(--gx-pink-glow);
            object-fit: cover;
        }

        .gx-btn-min {
            background: rgba(0,0,0,0.5); border: 1px solid var(--gx-pink);
            color: var(--gx-pink); font-size: 1.2em; width: 30px; height: 30px;
            border-radius: 50%; cursor: pointer; transition: 0.3s;
            display: flex; justify-content: center; align-items: center;
            padding-bottom: 5px;
        }
        .gx-btn-min:hover { background: var(--gx-pink); color: #000; box-shadow: 0 0 15px var(--gx-pink); }

        .gx-body {
            flex: 1; padding: 15px 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
            /* Scrollbar invisible */
            scrollbar-width: none;
        }
        .gx-body::-webkit-scrollbar { display: none; }

        .gx-msg-bot {
            background: linear-gradient(135deg, rgba(184, 134, 11, 0.8), rgba(0,0,0,0.6));
            color: #fff;
            padding: 12px 18px;
            border-radius: 20px 20px 20px 5px;
            font-size: 0.85em;
            max-width: 85%;
            box-shadow: 3px 3px 15px rgba(0,0,0,0.6);
            border-left: 2px solid var(--gx-gold);
            align-self: flex-start;
            text-shadow: 1px 1px 2px #000;
        }

        .gx-msg-user {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.3), rgba(0,0,0,0.5));
            color: #fff;
            padding: 12px 18px;
            border-radius: 20px 20px 5px 20px;
            font-size: 0.85em;
            max-width: 85%;
            box-shadow: -3px 3px 15px rgba(0,0,0,0.6);
            border-right: 2px solid var(--gx-pink);
            align-self: flex-end;
            text-shadow: 1px 1px 2px #000;
        }

        .gx-typing {
            font-style: italic; opacity: 0.7; color: var(--gx-gold);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }

        .gx-input-area {
            padding: 15px 20px 20px 20px;
            display: flex; gap: 10px;
            background: transparent;
        }

        .gx-input-area input {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(184, 134, 11, 0.5);
            border-radius: 20px;
            padding: 12px 20px;
            color: #fff; outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .gx-input-area input:focus { 
            box-shadow: 0 0 15px var(--gx-gold-glow);
            border-color: var(--gx-gold);
        }
        
        .gx-btn-send {
            background: var(--gx-pink);
            border: none; border-radius: 50%;
            width: 42px; height: 42px;
            color: #000; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 10px var(--gx-pink-glow);
            transition: 0.3s;
        }
        .gx-btn-send:hover { transform: scale(1.1); background: #fff; }

        /* Burbuja Flotante */
        .gx-bubble {
            width: 65px; height: 65px;
            background: linear-gradient(135deg, var(--gx-pink), #8b008b);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7), 0 0 25px var(--gx-pink-glow);
            cursor: pointer; pointer-events: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
            position: absolute; bottom: 0; left: 0;
            user-select: none;
        }
        
        .gx-bubble:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8), 0 0 35px var(--gx-pink);
        }

        .gx-bubble.gx-hidden {
            opacity: 0; transform: scale(0); pointer-events: none;
        }

        .gx-bubble img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
        }
    </style>

    <div id="gx-chat-container">
        
        <!-- Ventana de Chat (Abierta por defecto) -->
        <div id="gx-window" class="gx-chat-window">
            <div class="gx-header" id="gx-drag-handle">
                <div class="gx-title">
                    <img src="https://placehold.co/100x100/ff00ff/000000?text=GV" class="gx-avatar" alt="Avatar">
                    VITALANETJER
                </div>
                <button class="gx-btn-min" id="gx-minimize" title="Minimizar">_</button>
            </div>
            <div class="gx-body" id="gx-chat-body">
                <div class="gx-msg-bot">
                    AQUÍ GALAXY VYOLETA, VS-001.<br>INGRESA TU CLAVE DE CANJE AQUÍ O TU NOMBRE DE USUARIO 😁
                </div>
            </div>
            <div class="gx-input-area">
                <input type="text" id="gx-input-text" placeholder="Inicia transmisión..." autocomplete="off">
                <button class="gx-btn-send" id="gx-btn-send">➤</button>
            </div>
        </div>

        <!-- Burbuja (Oculta por defecto) -->
        <div id="gx-bubble" class="gx-bubble gx-hidden" title="Abrir Chat">
            <img src="https://placehold.co/100x100/ff00ff/000000?text=GV" alt="Avatar">
        </div>

    </div>

    <script id="galaxy-chat-logic">
        (function() {
            const gxContainer = document.getElementById('gx-chat-container');
            const gxWindow = document.getElementById('gx-window');
            const gxBubble = document.getElementById('gx-bubble');
            const btnMin = document.getElementById('gx-minimize');
            const dragHandle = document.getElementById('gx-drag-handle');
            
            const chatBody = document.getElementById('gx-chat-body');
            const inputText = document.getElementById('gx-input-text');
            const btnSend = document.getElementById('gx-btn-send');

            function addMsg(text, type, isTyping = false) {
                const msgDiv = document.createElement('div');
                msgDiv.className = type === 'user' ? 'gx-msg-user' : 'gx-msg-bot';
                if(isTyping) msgDiv.classList.add('gx-typing');
                
                // Si contiene HTML (saltos de linea) lo renderizamos, sino textContent
                msgDiv.innerHTML = text; 
                
                const id = 'msg_' + Date.now();
                msgDiv.id = id;
                chatBody.appendChild(msgDiv);
                chatBody.scrollTop = chatBody.scrollHeight;
                return id;
            }

            function updateMsg(id, text) {
                const msgDiv = document.getElementById(id);
                if(msgDiv) {
                    msgDiv.innerHTML = text;
                    msgDiv.classList.remove('gx-typing');
                }
            }

            async function procesarMensajeIA(mensaje) {
                if(!mensaje.trim()) return;
                
                // 1. Mostrar mensaje del usuario
                addMsg(mensaje, 'user');
                inputText.value = '';

                // 2. Mostrar indicador de carga IA
                const typingId = addMsg("📡 Vitalanetjer estableciendo conexión...", 'bot', true);

                try {
                    // CONFIGURACIÓN HACIA TU DARK SITE (Azure Function / API)
                    const DARK_SITE_URL = "https://tu-azure-function-url.azurewebsites.net/api/verificarUsuario";
                    
                    // ==========================================
                    // DESCOMENTA ESTO CUANDO TENGAS LA API REAL:
                    // ==========================================
                    /*
                    const response = await fetch(DARK_SITE_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clave: mensaje })
                    });
                    
                    if (!response.ok) throw new Error("Error en matriz Dark Site");
                    
                    const data = await response.json();
                    updateMsg(typingId, data.mensaje_ia || "Código procesado. Acceso concedido.");
                    */

                    // ==========================================
                    // SIMULACIÓN VISUAL (Mientras conectas la API real)
                    // ==========================================
                    setTimeout(() => {
                        updateMsg(typingId, `Análisis cuántico completado.<br>He buscado <b>[${mensaje}]</b> en la tabla Blob de Azure.<br><i>Estatus: Esperando enlace de base de datos real.</i>`);
                    }, 2000);

                } catch (error) {
                    updateMsg(typingId, "⚠️ Error de conexión con el Dark Site. Verifica la anomalía espacial.");
                    console.error("Dark Site Error:", error);
                }
            }

            // Eventos de envío de chat
            btnSend.addEventListener('click', () => procesarMensajeIA(inputText.value));
            inputText.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') procesarMensajeIA(inputText.value);
            });


            // Función de Cambio de Estado
            function abrirGxChat() {
                gxBubble.classList.add('gx-hidden');
                gxWindow.classList.remove('gx-hidden');
            }

            function cerrarGxChat() {
                gxWindow.classList.add('gx-hidden');
                gxBubble.classList.remove('gx-hidden');
            }

            btnMin.addEventListener('click', cerrarGxChat);

            // Auto-minimizar tras 8 segundos (Requerimiento)
            setTimeout(() => {
                if(!gxWindow.classList.contains('gx-hidden')) {
                    cerrarGxChat();
                }
            }, 8000);

            // Lógica Física VTHA Drag & Drop Aislada
            let drag = false;
            let startX, startY;
            let cLeft, cTop;
            let mX = 0, mY = 0;

            const draggables = [dragHandle, gxBubble];

            draggables.forEach(el => {
                el.addEventListener('mousedown', (e) => {
                    if(e.target === btnMin) return;
                    drag = true; mX = 0; mY = 0;
                    startX = e.clientX; startY = e.clientY;
                    const rect = gxContainer.getBoundingClientRect();
                    cLeft = rect.left; cTop = rect.top;
                    
                    gxContainer.style.bottom = 'auto';
                    gxContainer.style.right = 'auto';
                    gxContainer.style.left = `${cLeft}px`;
                    gxContainer.style.top = `${cTop}px`;

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
            });

            function onMove(e) {
                if(!drag) return;
                mX = e.clientX - startX;
                mY = e.clientY - startY;
                gxContainer.style.left = `${cLeft + mX}px`;
                gxContainer.style.top = `${cTop + mY}px`;
            }

            function onUp(e) {
                if(!drag) return;
                drag = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('mouseup', onUp);

                // Diferenciar Click vs Drag (Tolerancia de 5px)
                const dist = Math.sqrt(mX*mX + mY*mY);
                if (dist < 5 && (e.target === gxBubble || gxBubble.contains(e.target))) {
                    abrirGxChat();
                }
            }
        })();
    </script>
</body>
